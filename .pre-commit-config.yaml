---
# Run hooks only at the pre-commit stage by default.
# The dco-sign-off hook (prepare-commit-msg) otherwise makes all the checks run twice.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/nineyards-robotics/dco-sign-off
    rev: v1.0.0
    hooks:
      - id: dco-sign-off

  - repo: https://github.com/polymathrobotics/polymath_code_standard
    rev: emerson/c-no-indent-extern
    hooks:
      # Basic checks and fixes that apply to any text file and the git repository itself
      - id: polymath-general

      # Enforce and insert copyright headers in source code for the project's license
      # - id: polymath-copyright
      #   args: [--license, Apache-2.0, --wildcard-copyright-org, --reuse-style, --relicense]

      # Languages
      - id: polymath-cpp
      - id: polymath-python
      - id: polymath-shell
      - id: polymath-cmake

      # Markdown/up languages
      - id: polymath-markdown
      - id: polymath-xml
      - id: polymath-yaml
        # rosdoc2.yaml uses a mandated two-document layout that yamlfix rejects.
        exclude: (^|/)rosdoc2\.yaml$
